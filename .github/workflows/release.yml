name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # Visual Studio Marketplace trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Check tag matches package.json version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - name: Package
        run: npx vsce package -o dbt-nav.vsix

      - name: Create Open VSX namespace if missing
        run: |
          status="$(curl -s -o /dev/null -w '%{http_code}' https://open-vsx.org/api/aaaloui)"
          if [ "$status" = "404" ]; then
            npx ovsx create-namespace aaaloui
          fi
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Publish to Open VSX
        run: npx ovsx publish dbt-nav.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      # Trusted publishing: no secret needed. The Marketplace policy for the aaaloui
      # publisher trusts AAAloui/dbt-nav's release.yml (no GitHub environment), so
      # renaming this file or adding an `environment:` requires updating the policy.
      - name: Publish to Visual Studio Marketplace
        run: npx vsce publish --oidc --packagePath dbt-nav.vsix

      - name: Attach .vsix to GitHub release
        run: gh release create "${GITHUB_REF_NAME}" dbt-nav.vsix --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
